<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7c5a">
<title>Nur — Quran, Tafsir & Qibla</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#12151a;--muted:#6b7280;--brand:#0e7c5a;
--line:#e6e8ec;--fs:18px;--r:16px}
[data-theme=dark]{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#8b949e;
--brand:#2ea043;--line:#21262d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,
"Noto Sans Ethiopic",sans-serif;font-size:15px}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
background:var(--bg);box-shadow:0 0 50px rgba(0,0,0,.06)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;background:var(--card);
border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{background:none;border:0;color:var(--text);font-size:22px;width:38px;height:38px;
border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.ibtn:active{background:var(--line)}
main{flex:1;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.pad{padding:14px}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:30;
display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);
border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;padding:9px 2px 8px;color:var(--muted);font-size:10.5px;
display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit}
.tabs button.active{color:var(--brand);font-weight:600}
.tabs .ico{font-size:19px;line-height:1}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
background:var(--card);color:var(--text);font-family:inherit;font-size:15px;margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;
background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);
font-family:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.row:active{transform:scale(.99)}
.row .num{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;
display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:0 0 auto}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row b{font-weight:600;font-size:14.5px}
.row small{color:var(--muted);font-size:11.5px}
.row .ar2{font-family:"Amiri",serif;font-size:19px;color:var(--muted);flex:0 0 auto}
.row .chev{color:var(--muted);font-size:20px}
.ico2{font-size:20px;flex:0 0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--brand);font-weight:600;
letter-spacing:.02em;text-transform:uppercase}
.card.err{border-color:#e5484d;color:#e5484d}
.surah-head{text-align:center;padding:18px 10px 14px;margin-bottom:6px}
.surah-head h2{margin:0;font-family:"Amiri",serif;font-size:30px;font-weight:700}
.surah-head p{margin:6px 0 0;font-size:12px;color:var(--muted)}
.ayah{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:12px 14px;margin-bottom:10px}
.ayhead{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.badge{width:26px;height:26px;border-radius:8px;background:var(--bg);border:1px solid var(--line);
display:grid;place-items:center;font-size:11.5px;color:var(--muted);font-weight:600}
.mini{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;
width:32px;height:32px;font-size:13px;cursor:pointer;display:grid;place-items:center}
.mini:active{background:var(--line)}
.grow-s{flex:1}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;text-align:right;
font-size:calc(var(--fs) * 1.55);line-height:2.05;margin:6px 0 0}
.ar.sm{font-size:calc(var(--fs) * 1.1);line-height:1.95;color:var(--text)}
.tr{color:var(--muted);font-size:14.5px;line-height:1.8;margin:10px 0 0}
.en{font-size:14px;line-height:1.75;margin:0;color:var(--text)}
.basmala{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;text-align:center;
font-size:calc(var(--fs) * 1.6);line-height:2.1;margin:12px 0 18px;color:var(--text)}
.loading{text-align:center;color:var(--muted);padding:34px 0;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:26px 0}
.note{background:var(--card);border:1px dashed var(--line);border-radius:12px;
padding:11px 13px;font-size:12px;color:var(--muted);line-height:1.65;margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
select,input[type=number],input[type=text]{width:100%;padding:11px 12px;border-radius:11px;
border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;font-size:14.5px}
.btn{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--card);
color:var(--text);font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
text-decoration:none;text-align:center;display:block}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:active{opacity:.85}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;
padding:13px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:0}
.rowline span{font-size:14px}
.switch{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;
cursor:pointer;border:0;transition:.2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--brand)}
.switch.on::after{left:23px}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;
transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:11px 18px;
border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none !important}
.compass{width:140px;height:140px;border-radius:50%;border:4px solid var(--brand);
margin:18px auto;position:relative;background:var(--bg)}
.compass::before{content:"N";position:absolute;top:6px;left:50%;transform:translateX(-50%);
font-size:14px;font-weight:700;color:var(--brand)}
.needle{width:6px;height:60px;background:linear-gradient(to top,#e5484d 0 50%,#3a86ff 50% 100%);
position:absolute;top:50%;left:50%;
transform-origin:bottom center;transform:translate(-50%,-100%) rotate(0deg);border-radius:3px}
.qibla-text{text-align:center;font-size:14px;color:var(--text);margin-top:8px}
.step{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;
border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.step.ok .dot{background:#2ea043}
.step.err .dot{background:#e5484d}
.step.run .dot{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="ibtn" id="back" hidden>‹</button>
    <div class="ttl"><h1 id="title">Quran</h1><p id="subtitle" hidden></p></div>
    <button class="ibtn" id="theme">◐</button>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <button data-tab="quran"><span class="ico">📖</span><span>Quran</span></button>
    <button data-tab="tafsir"><span class="ico">📜</span><span>Tafsir</span></button>
    <button data-tab="masjid"><span class="ico">🕌</span><span>Masjid</span></button>
    <button data-tab="settings"><span class="ico">⚙️</span><span>Settings</span></button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ALQURAN = 'https://api.alquran.cloud/v1';
const QURANENC = 'https://quranenc.com/api/v1';
const AUDIO = 'https://cdn.islamic.network/quran/audio/128/ar.alafasy';
const LANGS = { am: 'አማርኛ', om: 'Afaan Oromoo', en: 'English', ar: 'العربية' };

// የተረጋገጡ የQuranEnc ቁልፎች (ከ quranenc.com/api/v1/translations/list/...)
const QURANENC_KEYS = {
  am: 'amharic_zain',      // አማርኛ - አፍሪካ አካዳሚ
  om: 'oromo_ababor'       // ኦሮምኛ - ጋሊ አባቦር
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
  clear() { try { localStorage.clear(); } catch {} }
};

async function getJSON(url, ttl = 30 * 864e5) {
  const key = 'c:' + url;
  const hit = store.get(key);
  if (hit && Date.now() - hit.t < ttl) return hit.v;
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const v = await r.json();
  store.set(key, { t: Date.now(), v });
  return v;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function stripHtml(h) {
  if (!h) return '';
  const d = new DOMParser().parseFromString(h, 'text/html');
  d.querySelectorAll('sup').forEach(n => n.remove());
  return (d.body.textContent || '').replace(/\s+/g, ' ').trim();
}

function haversine(a, b, c, d) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (c - a) * r, dLon = (d - b) * r;
  const x = Math.sin(dLat / 2) ** 2 +
    Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

function qiblaBearing(lat, lon) {
  const K_LAT = 21.422487 * Math.PI / 180;
  const K_LON = 39.826206 * Math.PI / 180;
  const φ1 = lat * Math.PI / 180;
  const λ1 = lon * Math.PI / 180;
  const Δλ = K_LON - λ1;
  const y = Math.sin(Δλ) * Math.cos(K_LAT);
  const x = Math.cos(φ1) * Math.sin(K_LAT) - Math.sin(φ1) * Math.cos(K_LAT) * Math.cos(Δλ);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

/* ============ Basmala splitter ============ */
// የብስመላህ ጽሑፍ (አረብኛ እና የአማራጭ ስሪቶች)
function splitBasmala(arabicText, surahNum, ayahNum) {
  // ሱራ 1 እና 9 ብስመላህ ለብቻ አይለይም (ሱራ 1 ብስመላህ የለውም እንደ አያህ፣ ሱራ 9 ደግሞ ፈጽሞ የለውም)
  if (surahNum === 1 || surahNum === 9) {
    return { basmala: null, text: arabicText };
  }

  // ለሌሎች ሱራዎች የመጀመሪያው አያህ ብስመላህን ይዟል
  if (ayahNum === 1) {
    // የብስመላህ መደበኛ ጽሑፍ
    const basmalaPlain = "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";
    // የተለያዩ የአረብኛ ስሪቶች (ዑስማኒ፣ ኢምላኢ፣ ወዘተ)
    const variants = [
      basmalaPlain,
      "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
      "بسم الله الرحمن الرحيم",
      "بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ"
    ];

    for (const b of variants) {
      const idx = arabicText.indexOf(b);
      if (idx !== -1) {
        return {
          basmala: b,
          text: arabicText.slice(idx + b.length).trim()
        };
      }
    }

    // የተለየ ዘዴ፦ የመጀመሪያዎቹን 39 ቁምፊዎች መቀነስ (አልቃን ክላውድ ሰነድ)
    if (arabicText.length > 39) {
      return {
        basmala: arabicText.slice(0, 39).trim(),
        text: arabicText.slice(39).trim()
      };
    }
  }

  return { basmala: null, text: arabicText };
}

/* ============ state ============ */
const state = {
  tab: store.get('tab', 'quran'),
  lang: store.get('lang', 'am'),
  theme: store.get('theme', 'light'),
  fs: store.get('fs', 18),
  screen: { name: 'surahs' }
};

function applyTheme() {
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.style.setProperty('--fs', state.fs + 'px');
}

function setChrome(title, sub) {
  $('#title').textContent = title;
  const s = $('#subtitle');
  s.textContent = sub || '';
  s.hidden = !sub;
}

/* ============ audio ============ */
const audioEl = new Audio();
let playingBtn = null;
audioEl.addEventListener('ended', () => {
  if (playingBtn) { playingBtn.textContent = '▶'; playingBtn = null; }
});
function playAyah(globalNum, btn) {
  if (playingBtn === btn && !audioEl.paused) {
    audioEl.pause(); btn.textContent = '▶'; playingBtn = null; return;
  }
  if (playingBtn) playingBtn.textContent = '▶';
  audioEl.src = `${AUDIO}/${globalNum}.mp3`;
  audioEl.play().then(() => { btn.textContent = '⏸'; playingBtn = btn; })
    .catch(() => toast('Cannot play audio'));
}

/* ============ data ============ */
let surahsCache = null;
async function loadSurahs() {
  if (surahsCache) return surahsCache;
  const j = await getJSON(`${ALQURAN}/surah`);
  surahsCache = j.data;
  return surahsCache;
}

const trCache = {};
async function resolveTranslation(lang) {
  if (lang === 'ar') return null;
  if (trCache[lang] !== undefined) return trCache[lang];
  const key = 'tr:' + lang;
  const cached = store.get(key);
  if (cached) return (trCache[lang] = cached);
  try {
    const j = await getJSON(`${ALQURAN}/edition?format=text&type=translation&language=${lang}`);
    const id = j.data?.[0]?.identifier || null;
    if (id) { store.set(key, id); return (trCache[lang] = id); }
  } catch {}
  return (trCache[lang] = 'en.sahih');
}

async function loadQuranEncKey(lang) {
  if (QURANENC_KEYS[lang]) return QURANENC_KEYS[lang];
  try {
    const j = await getJSON(`${QURANENC}/translations/list/${lang}?localization=en`);
    const list = j.translations || [];
    if (list.length > 0) {
      QURANENC_KEYS[lang] = list[0].key;
      return list[0].key;
    }
  } catch {}
  return null;
}

/* ============ router ============ */
async function render() {
  applyTheme();
  const sc = state.screen;
  $('#back').hidden = !sc.back;
  $$('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  try {
    if (sc.name === 'surahs') await viewSurahs();
    else if (sc.name === 'surah') await viewSurah(sc.n);
    else if (sc.name === 'tafsir') await viewTafsir(sc.s, sc.a);
    else if (sc.name === 'masjid') viewMasjid();
    else if (sc.name === 'settings') viewSettings();
  } catch (e) {
    $('#view').innerHTML = `<div class="pad"><div class="card err">
      <b>Error:</b> ${esc(e.message)}<br>
      <small>Check your internet connection.</small></div></div>`;
  }
}

function go(screen) { state.screen = screen; window.scrollTo(0, 0); render(); }

function setTab(tab) {
  state.tab = tab; store.set('tab', tab);
  state.screen =
    tab === 'quran' ? { name: 'surahs' } :
    tab === 'tafsir' ? { name: 'tafsir' } :
    tab === 'masjid' ? { name: 'masjid' } : { name: 'settings' };
  window.scrollTo(0, 0);
  render();
}

/* ============ 1. surah list ============ */
async function viewSurahs() {
  setChrome('Quran', '114 Surahs · ' + LANGS[state.lang]);
  const list = await loadSurahs();
  const last = store.get('lastRead', null);

  $('#view').innerHTML = `<div class="pad">
    ${last ? `<button class="row" id="resume" style="margin-bottom:12px">
      <span class="ico2">🔖</span>
      <span class="grow"><b>Continue reading</b>
        <small>${esc(last.name)} · Ayah ${last.a}</small></span>
      <span class="chev">›</span></button>` : ''}
    <input class="search" id="q" placeholder="Search surah...">
    <div class="list" id="list"></div>
  </div>`;

  const draw = (filter = '') => {
    const f = filter.trim().toLowerCase();
    const items = list.filter(s =>
      !f || s.englishName.toLowerCase().includes(f) ||
      s.name.includes(f) || String(s.number) === f);
    $('#list').innerHTML = items.map(s => `
      <button class="row" data-n="${s.number}">
        <span class="num">${s.number}</span>
        <span class="grow"><b>${esc(s.englishName)}</b>
          <small>${s.numberOfAyahs} ayahs · ${s.revelationType}</small></span>
        <span class="ar2">${esc(s.name.replace('سُورَةُ ', ''))}</span>
      </button>`).join('') || '<p class="empty">No results</p>';
  };
  draw();

  $('#q').addEventListener('input', e => draw(e.target.value));
  $('#list').addEventListener('click', e => {
    const b = e.target.closest('.row');
    if (b) go({ name: 'surah', n: +b.dataset.n, back: true });
  });
  const r = $('#resume');
  if (r) r.onclick = () => go({ name: 'surah', n: last.n, back: true });
}

/* ============ 2. surah reader ============ */
async function viewSurah(n) {
  setChrome('Loading…', '');
  $('#view').innerHTML = '<div class="pad"><div class="loading">Loading…</div></div>';

  const trId = await resolveTranslation(state.lang);
  const eds = trId ? `quran-uthmani,${trId}` : 'quran-uthmani';
  const j = await getJSON(`${ALQURAN}/surah/${n}/editions/${eds}`);
  const arr = Array.isArray(j.data) ? j.data : [j.data];
  const byId = {}; arr.forEach(x => byId[x.edition.identifier] = x);
  const ar = byId['quran-uthmani'];
  const tr = trId ? byId[trId] : null;

  setChrome(ar.englishName, `${ar.name} · ${ar.numberOfAyahs} ayahs`);
  store.set('lastRead', { n, a: 1, name: ar.englishName });

  // ብስመላህን ከመጀመሪያው አያህ ለይቶ ማውጣት
  const firstAyahOriginal = ar.ayahs[0];
  const { basmala, text: firstAyahText } = splitBasmala(firstAyahOriginal.text, n, 1);

  const body = ar.ayahs.map((a, i) => {
    const isFirst = i === 0;
    const arabicText = isFirst ? firstAyahText : a.text;
    const t = tr?.ayahs?.[i]?.text || '';

    return `<article class="ayah">
      <div class="ayhead">
        <span class="badge">${a.numberInSurah}</span>
        <span class="grow-s"></span>
        <button class="mini" data-play="${a.number}">▶</button>
        <button class="mini" data-taf="${a.numberInSurah}">📜</button>
      </div>
      <p class="ar">${esc(arabicText)}</p>
      ${t ? `<p class="tr">${esc(t)}</p>` : ''}
    </article>`;
  }).join('');

  // ብስመላህን ለብቻ አሳይ (ካለ)
  const basmalaHtml = basmala
    ? `<p class="basmala">${esc(basmala)}</p>`
    : '';

  $('#view').innerHTML = `<div class="pad">
    ${trId ? '' : `<div class="note">${LANGS[state.lang]} translation not found — showing English.</div>`}
    <div class="surah-head"><h2>${esc(ar.name)}</h2>
      <p>${esc(ar.englishName)} · ${ar.numberOfAyahs} ayahs · ${ar.revelationType}</p></div>
    ${basmalaHtml}
    ${body}
    <div class="note">Educational tool only — not a religious authority. Consult scholars for personal rulings.</div>
  </div>`;

  $('#view').addEventListener('click', e => {
    const p = e.target.closest('[data-play]');
    if (p) return playAyah(+p.dataset.play, p);
    const t = e.target.closest('[data-taf]');
    if (t) {
      state.tab = 'tafsir';
      go({ name: 'tafsir', s: n, a: +t.dataset.taf, back: false });
    }
  });
}

/* ============ 3. tafsir / translation ============ */
async function viewTafsir(s, a) {
  setChrome('Tafsir / Translation', s ? `${s}:${a}` : '');
  const surahs = await loadSurahs();
  $('#view').innerHTML = `<div class="pad">
    <div class="card">
      <div class="grid2">
        <div><label>Surah</label><select id="ts">
          ${surahs.map(x => `<option value="${x.number}" ${x.number === (s || 1) ? 'selected' : ''}>
            ${x.number}. ${esc(x.englishName)}</option>`).join('')}
        </select></div>
        <div><label>Ayah</label><input id="ta" type="number" min="1" value="${a || 1}"></div>
      </div>
      <button class="btn primary" id="tgo">Show</button>
    </div>
    <div id="tout"></div>
  </div>`;

  $('#tgo').onclick = () => {
    const s2 = +$('#ts').value, a2 = Math.max(1, +($('#ta').value || 1));
    state.screen = { name: 'tafsir', s: s2, a: a2, back: false };
    render();
  };
  if (s && a) showTafsir(s, a);
}

async function showTafsir(s, a) {
  const out = $('#tout');
  out.innerHTML = '<div class="loading">Loading…</div>';
  const ref = `${s}:${a}`;
  const lang = state.lang;

  let arText = null, tafEn = null, tafAr = null, transText = null;
  let sourceLabel = '';

  // 1) Arabic text + Muyassar tafsir
  try {
    const j = await getJSON(`${ALQURAN}/ayah/${ref}/editions/quran-uthmani,ar.muyassar`);
    const arr = Array.isArray(j.data) ? j.data : [j.data];
    const byId = {}; arr.forEach(x => byId[x.edition.identifier] = x);
    arText = byId['quran-uthmani']?.text || null;
    tafAr = byId['ar.muyassar']?.text || null;
    if (tafAr) sourceLabel = 'التفسير الميسر (AlQuran Cloud)';
  } catch {}

  // 2) English Ibn Kathir
  if (lang === 'en' || !tafAr) {
    try {
      const j = await getJSON(`https://api.quran.com/api/v4/tafsirs/169/by_ayah/${ref}`, 10 * 864e5);
      tafEn = stripHtml(j.tafsir?.text || '');
      if (tafEn) sourceLabel = 'Tafsir Ibn Kathir (Quran.com)';
    } catch {}
  }

  // 3) Amharic / Oromo translation from QuranEnc
  if (lang === 'am' || lang === 'om') {
    const key = await loadQuranEncKey(lang);
    if (key) {
      try {
        const j = await getJSON(`${QURANENC}/translation/sura/${key}/${s}`);
        // የQuranEnc መልስ: [{sura, aya, translation, footnotes}]
        const list = Array.isArray(j) ? j : (j.ayahs || []);
        const ayah = list.find(x => x.aya === a);
        transText = ayah?.translation || null;
        if (transText) sourceLabel = `QuranEnc (${LANGS[lang]} — ${key})`;
      } catch (e) {
        console.warn('QuranEnc failed:', e);
      }
    }

    // Fallback for Oromo: AlQuran Cloud
    if (!transText && lang === 'om') {
      try {
        const j = await getJSON(`${ALQURAN}/ayah/${ref}/om.abubakr`);
        transText = j.data?.text || null;
        if (transText) sourceLabel = 'AlQuran Cloud (Afaan Oromoo)';
      } catch {}
    }
  }

  const label = (tafAr || tafEn) ? 'Tafsir' : 'Translation';

  out.innerHTML = `
    <article class="ayah"><p class="ar">${esc(arText || '')}</p></article>
    ${transText ? `<section class="card"><h3>${label} — ${LANGS[lang]}</h3>
      <p class="tr">${esc(transText)}</p></section>` : ''}
    ${tafAr ? `<section class="card"><h3>Tafsir (Arabic) — Muyassar</h3>
      <p class="ar sm">${esc(tafAr)}</p></section>` : ''}
    ${tafEn ? `<section class="card"><h3>Tafsir (English) — Ibn Kathir</h3>
      <p class="en">${esc(tafEn)}</p></section>` : ''}
    ${!transText && !tafAr && !tafEn ? `<div class="note">No data found for this ayah.</div>` : ''}
    <div class="note">Source: ${esc(sourceLabel || 'verified source')}. Consult scholars for personal rulings.</div>`;
}

/* ============ 4. masjid & qibla ============ */
function viewMasjid() {
  setChrome('Masjid & Qibla', 'Nearby');
  $('#view').innerHTML = `<div class="pad">
    <div class="card">
      <button class="btn primary" id="find">📍 Use my location</button>
      <div class="grid2" style="margin-top:10px">
        <div><label>Latitude</label>
          <input id="mlat" type="number" step="any" placeholder="e.g. 9.0300" value="9.0300"></div>
        <div><label>Longitude</label>
          <input id="mlon" type="number" step="any" placeholder="e.g. 38.7400" value="38.7400"></div>
      </div>
      <button class="btn" id="manual" style="margin-top:8px">Search with these coordinates</button>
      <p style="font-size:11.5px;color:var(--muted);margin:8px 0 0;text-align:center">
        Default: Addis Ababa (9.03, 38.74) — edit and search</p>
    </div>
    <div id="mout"></div>
    <div class="note">Data: OpenStreetMap via Overpass API. Some masjids in Ethiopia may not be mapped yet.
      If no results, use the Google Maps link that will appear.</div>
  </div>`;

  $('#find').onclick = () => {
    if (!navigator.geolocation) {
      $('#mout').innerHTML = '<div class="card err">Geolocation not supported. Enter coordinates manually below.</div>';
      return;
    }
    const out = $('#mout');
    out.innerHTML = '<div class="loading">Requesting location permission…</div>';
    navigator.geolocation.getCurrentPosition(
      pos => doMosqueSearch(pos.coords.latitude, pos.coords.longitude),
      err => {
        const msgs = {
          1: 'Permission denied. Allow location in browser settings, or enter coordinates manually.',
          2: 'Location unavailable. Try again or enter coordinates manually.',
          3: 'Request timed out. Try again.'
        };
        out.innerHTML = `<div class="card err">${msgs[err.code] || err.message}</div>`;
      },
      { timeout: 20000, enableHighAccuracy: false, maximumAge: 60000 }
    );
  };

  $('#manual').onclick = () => {
    const la = parseFloat($('#mlat').value || '9.0300');
    const lo = parseFloat($('#mlon').value || '38.7400');
    if (!isFinite(la) || !isFinite(lo)) {
      $('#mout').innerHTML = '<div class="card err">Invalid coordinates.</div>'; return;
    }
    doMosqueSearch(la, lo);
  };
}

async function doMosqueSearch(lat, lon) {
  const out = $('#mout');
  const bearing = qiblaBearing(lat, lon);
  const gmaps = `https://www.google.com/maps/search/mosque/@${lat},${lon},15z`;

  const steps = [
    { id: 'ovp', label: 'Querying Overpass API…', state: 'run' },
    { id: 'nom', label: 'Trying Nominatim fallback…', state: 'wait' }
  ];
  const renderSteps = () => `
    <div class="card">
      <h3>Search status</h3>
      ${steps.map(s => `<div class="step ${s.state}" data-step="${s.id}">
        <span class="dot"></span><span>${s.label}</span></div>`).join('')}
      <div class="step"><span class="dot"></span><span>
        📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}</span></div>
    </div>`;

  out.innerHTML = renderSteps();

  let items = [];
  try {
    items = await searchOverpass(lat, lon);
    steps[0].state = items.length ? 'ok' : 'err';
    steps[0].label = items.length
      ? `Overpass: ${items.length} masjids found`
      : 'Overpass: 0 results';
  } catch (e) {
    steps[0].state = 'err';
    steps[0].label = 'Overpass: ' + (e.message || 'network error');
  }
  out.innerHTML = renderSteps();

  if (!items.length) {
    steps[1].state = 'run';
    out.innerHTML = renderSteps();
    try {
      items = await searchNominatim(lat, lon);
      steps[1].state = items.length ? 'ok' : 'err';
      steps[1].label = items.length
        ? `Nominatim: ${items.length} masjids found`
        : 'Nominatim: 0 results';
    } catch (e) {
      steps[1].state = 'err';
      steps[1].label = 'Nominatim: ' + (e.message || 'network error');
    }
  } else {
    steps[1].state = 'ok';
    steps[1].label = 'Nominatim: skipped (Overpass succeeded)';
  }

  const compassHtml = `
    <div class="card">
      <h3>Qibla direction</h3>
      <div class="compass">
        <div class="needle" style="transform:translate(-50%,-100%) rotate(${bearing}deg)"></div>
      </div>
      <p class="qibla-text">From North: <b>${bearing.toFixed(0)}°</b> to Kaaba</p>
      <p style="font-size:12px;color:var(--muted);text-align:center;margin:4px 0 0">
        Hold phone flat; red end points to Qibla.</p>
    </div>`;

  const statusHtml = renderSteps();

  if (items.length) {
    out.innerHTML = compassHtml + statusHtml + `<div class="list">${items.map(m => `
      <a class="row" href="https://www.google.com/maps?q=${m.la},${m.lo}"
         target="_blank" rel="noopener">
        <span class="ico2">🕌</span>
        <span class="grow"><b>${esc(m.name)}</b>
          <small>${m.d < 1000 ? Math.round(m.d) + ' m' : (m.d / 1000).toFixed(1) + ' km'}</small></span>
        <span class="chev">›</span>
      </a>`).join('')}</div>`;
  } else {
    out.innerHTML = compassHtml + statusHtml + `
      <div class="card">
        <p style="margin:0 0 10px">
          No masjids found within 10 km in OpenStreetMap. This area may not be well-mapped.
          Try Google Maps:
        </p>
        <a class="btn primary" href="${gmaps}" target="_blank" rel="noopener">
          🗺️ Search in Google Maps</a>
      </div>`;
  }
}

async function searchOverpass(lat, lon) {
  const endpoints = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
    'https://overpass.osm.ch/api/interpreter'
  ];
  const radii = [3000, 10000];
  const map = new Map();

  for (const radius of radii) {
    const q = `[out:json][timeout:30];
(
  node["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${lat},${lon});
  way["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${lat},${lon});
);
out center;`;

    for (const url of endpoints) {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 20000);
        const r = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(q),
          signal: ctrl.signal
        });
        clearTimeout(timer);
        if (!r.ok) continue;
        const j = await r.json();
        for (const el of j.elements || []) {
          const la = el.lat ?? el.center?.lat;
          const lo = el.lon ?? el.center?.lon;
          if (!la || !lo) continue;
          const id = `${la.toFixed(5)},${lo.toFixed(5)}`;
          if (map.has(id)) continue;
          map.set(id, {
            name: el.tags?.name || el.tags?.['name:en'] ||
                  el.tags?.['name:am'] || el.tags?.['name:om'] || 'Masjid',
            la, lo, d: haversine(lat, lon, la, lo)
          });
        }
        if (map.size) break;
      } catch { continue; }
    }
    if (map.size) break;
  }

  return [...map.values()].sort((a, b) => a.d - b.d).slice(0, 30);
}

async function searchNominatim(lat, lon) {
  const d = 0.2;
  const viewbox = `${lon - d},${lat + d},${lon + d},${lat - d}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=30` +
              `&q=mosque&bounded=1&viewbox=${viewbox}`;
  const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return j.filter(x => x.lat && x.lon)
    .map(x => ({
      name: x.display_name?.split(',')[0] || 'Masjid',
      la: +x.lat, lo: +x.lon, d: haversine(lat, lon, +x.lat, +x.lon)
    }))
    .sort((a, b) => a.d - b.d);
}

/* ============ 5. settings ============ */
function viewSettings() {
  setChrome('Settings', '');
  $('#view').innerHTML = `<div class="pad">
    <div class="card">
      <h3>Quran translation language</h3>
      ${Object.entries(LANGS).map(([k, v]) => `
        <label class="rowline" style="margin:0">
          <span>${v}</span>
          <input type="radio" name="lang" value="${k}" ${state.lang === k ? 'checked' : ''}>
        </label>`).join('')}
      <p style="font-size:11.5px;color:var(--muted);margin:10px 0 0">
        Note: This changes the Quran translation language only.
        The interface stays in English.</p>
    </div>
    <div class="card">
      <h3>Appearance</h3>
      <div class="rowline"><span>Dark mode</span>
        <button class="switch ${state.theme === 'dark' ? 'on' : ''}" id="thm"></button></div>
      <div class="rowline"><span>Font size</span>
        <input type="range" id="fs" min="14" max="26" value="${state.fs}" style="width:140px"></div>
    </div>
    <div class="card">
      <h3>Data sources</h3>
      <p style="font-size:12px;color:var(--muted);line-height:1.7">
        Quran: api.alquran.cloud<br>
        Tafsir: AlQuran Cloud + Quran.com<br>
        Amharic/Oromo translation: QuranEnc<br>
        Masjid data: OpenStreetMap<br>
        Audio: cdn.islamic.network</p>
    </div>
    <button class="btn" id="clear" style="color:#e5484d">Clear cache</button>
    <div class="note">Educational tool only — not a religious authority.
      Tafsir/translations come from verified sources.
      Consult scholars for personal rulings.</div>
  </div>`;

  $$('input[name=lang]').forEach(r => r.onchange = () => {
    state.lang = r.value; store.set('lang', r.value);
    surahsCache = null;
    toast('Translation: ' + LANGS[r.value]);
  });
  $('#thm').onclick = e => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    store.set('theme', state.theme);
    applyTheme();
    e.currentTarget.classList.toggle('on', state.theme === 'dark');
  };
  $('#fs').oninput = e => {
    state.fs = +e.target.value; store.set('fs', state.fs); applyTheme();
  };
  $('#clear').onclick = () => {
    if (confirm('Clear all cache?')) { store.clear(); location.reload(); }
  };
}

/* ============ boot ============ */
$('#back').onclick = () => {
  if (state.screen.name === 'surah') go({ name: 'surahs' });
};
$('#theme').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  store.set('theme', state.theme); applyTheme();
};
$$('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

applyTheme();
setTab(state.tab);

// Bump version when updating to bust service worker cache
const APP_VERSION = 'v5';
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js?v=' + APP_VERSION).catch(() => {});
}
